<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Menu Builder | Saan Tayo?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  /* Same palette as style.css on the main site */
  :root {
    --darkbrown: #3B2418; --brown: #6B4A38; --pandan: #7A8B5D; --babyblue: #8EC5FF;
    --paper: #F2E8DA; --white: #FBF6EE; --line: #DCCDB8; --muted: #7A6455; --danger: #A33B2E;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--paper); color: var(--darkbrown);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
  :focus-visible { outline: 3px solid var(--babyblue); outline-offset: 2px; }

  header { background: var(--darkbrown); padding: max(1.25rem, env(safe-area-inset-top)) 0 1.25rem; }
  .wrap { width: min(100% - 2rem, 44rem); margin-inline: auto; }
  h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 2rem;
       letter-spacing: -0.02em; color: var(--babyblue); }
  header p { margin: 0.25rem 0 0; color: #E6DACB; font-size: 0.95rem; }
  main { padding: 1.5rem 0 4rem; }

  fieldset { border: 1px solid var(--line); border-radius: 14px; background: var(--white);
             padding: 1rem; margin: 0 0 1rem; }
  legend { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; padding: 0 0.5rem; }
  label { display: block; font-weight: 600; font-size: 0.9rem; margin: 0.75rem 0 0.25rem; }
  fieldset > label:first-of-type, .row label { margin-top: 0; }
  .row { display: flex; gap: 0.75rem; margin-top: 0.75rem; }
  .row > div { flex: 1; }

  input[type=text], input[type=email], input[type=password], input[type=number], textarea, select {
    width: 100%; min-height: 44px; padding: 0.5rem 0.75rem; border: 1.5px solid var(--line);
    border-radius: 10px; font: inherit; font-size: 1rem; background: #fff; color: var(--darkbrown);
  }
  textarea { min-height: 4.5rem; resize: vertical; }
  .choice { display: flex; align-items: center; gap: 0.6rem; font-weight: 400; margin: 0.5rem 0 0; min-height: 44px; }
  .choice input { width: 1.2rem; height: 1.2rem; accent-color: var(--darkbrown); }

  button { font: inherit; font-weight: 700; min-height: 44px; border: 0; border-radius: 10px;
           padding: 0 1.1rem; cursor: pointer; }
  .primary { background: var(--darkbrown); color: var(--white); }
  .primary:hover { background: var(--brown); }
  .primary:disabled { opacity: 0.6; cursor: wait; }
  .secondary { background: var(--pandan); color: #fff; margin-top: 0.75rem; }
  .big { width: 100%; font-size: 1.05rem; min-height: 52px; }
  .link { background: transparent; color: var(--muted); border: 1.5px solid var(--line); font-weight: 600; }
  .danger { color: var(--danger); }

  .category { border: 1px dashed var(--line); border-radius: 12px; padding: 0.75rem; margin-top: 0.75rem; }
  .cat-head { display: flex; gap: 0.5rem; }
  .dish { display: grid; grid-template-columns: 1fr 6.5rem auto; gap: 0.5rem; margin-top: 0.5rem; }
  .dish .dish-note { grid-column: 1 / -1; grid-row: 2; }
  @media (min-width: 640px) {
    .dish { grid-template-columns: 1fr 6.5rem 1fr auto; }
    .dish .dish-note { grid-column: auto; grid-row: auto; }
  }

  .bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem;
         margin-bottom: 1rem; color: var(--muted); font-size: 0.9rem; }
  .msg { margin: 0.75rem 0 0; font-weight: 600; }
  .msg.ok { color: #4D6B2E; } .msg.err { color: var(--danger); }
  .hint { color: var(--muted); font-size: 0.875rem; margin: 0.25rem 0 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Menu Builder</h1>
    <p>Add places and menus straight to the live site.</p>
  </div>
</header>

<main class="wrap">

  <!-- ============ SIGN IN ============ -->
  <section id="login" hidden>
    <form id="login-form">
      <fieldset>
        <legend>Sign in</legend>
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required>
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
        <button type="submit" class="primary" style="margin-top:1rem">Sign in</button>
        <p id="login-msg" class="msg" role="status"></p>
      </fieldset>
    </form>
  </section>

  <!-- ============ BUILDER ============ -->
  <section id="app" hidden>
    <div class="bar">
      <span>Signed in as <strong id="who"></strong></span>
      <button type="button" id="signout" class="link">Sign out</button>
    </div>

    <fieldset>
      <legend>What are you adding?</legend>
      <label class="choice"><input type="radio" name="mode" id="mode-new" checked> A new place</label>
      <label class="choice"><input type="radio" name="mode" id="mode-existing"> New categories for a place that’s already on the site</label>
      <div id="existing-picker" hidden>
        <label for="existing-place">Which place?</label>
        <select id="existing-place"></select>
      </div>
    </fieldset>

    <form id="builder-form">
      <fieldset id="place-details">
        <legend>Place details</legend>
        <label for="name">Place name</label>
        <input type="text" id="name" placeholder="e.g. Cafe Juanita">

        <div class="row">
          <div>
            <label for="type">Type</label>
            <select id="type"><option value="cafe">Cafe</option><option value="restaurant">Restaurant</option></select>
          </div>
          <div>
            <label for="city">City</label>
            <select id="city"><option>Quezon City</option><option>Manila</option></select>
          </div>
        </div>

        <label for="area">Area or neighborhood</label>
        <input type="text" id="area" placeholder="e.g. Maginhawa, Teachers Village">
        <label for="hours">Hours</label>
        <input type="text" id="hours" placeholder="e.g. 8:00 AM – 10:00 PM">
        <label for="description">Short description (1–2 sentences)</label>
        <textarea id="description" placeholder="What makes this place worth visiting?"></textarea>
        <label for="updated">Prices last checked</label>
        <input type="text" id="updated" placeholder="e.g. November 2026">
      </fieldset>

      <fieldset>
        <legend id="menu-legend">Menu</legend>
        <div id="categories"></div>
        <button type="button" class="secondary" id="add-category">Add category</button>
      </fieldset>

      <button type="submit" class="primary big" id="save">Save to site</button>
      <p id="save-msg" class="msg" role="status"></p>
    </form>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* Same publishable key as the live site. It can only READ.
   Writing works only after you sign in, because of the owner-only
   policies in Supabase. NEVER paste the secret key here. */
const db = supabase.createClient(
  "https://uaqzqotirikxzuebdfne.supabase.co",
  "sb_publishable_-8g6F5S2YExB8W2bFWQyFw_3GNvuinP"
);

const $ = (id) => document.getElementById(id);
let places = [];

function setMsg(id, text, isError) {
  const el = $(id);
  el.textContent = text;
  el.className = "msg" + (text ? (isError ? " err" : " ok") : "");
}

const slugify = (t) => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/&/g, " and ").replace(/['’]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");


/* ---------- Sign in / out ---------- */
async function refreshSession() {
  const { data } = await db.auth.getSession();
  const session = data.session;
  $("login").hidden = !!session;
  $("app").hidden = !session;
  $("who").textContent = session ? session.user.email : "";
  if (session) await loadPlaces();
}

$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  setMsg("login-msg", "");
  const { error } = await db.auth.signInWithPassword({
    email: $("email").value.trim(), password: $("password").value
  });
  if (error) return setMsg("login-msg", "Couldn’t sign in: " + error.message, true);
  $("password").value = "";
  refreshSession();
});

$("signout").addEventListener("click", async () => { await db.auth.signOut(); refreshSession(); });


/* ---------- Existing places (for the dropdown + slug checks) ---------- */
async function loadPlaces() {
  const { data, error } = await db.from("places").select("id, slug, name, city").order("name");
  if (error) return setMsg("save-msg", "Couldn’t load places: " + error.message, true);
  places = data;
  const select = $("existing-place");
  select.replaceChildren(...places.map((p) => {
    const opt = document.createElement("option");
    opt.value = p.id;
    opt.textContent = p.name + " (" + p.city + ")";
    return opt;
  }));
}


/* ---------- Mode switch ---------- */
function updateMode() {
  const existing = $("mode-existing").checked;
  $("existing-picker").hidden = !existing;
  $("place-details").hidden = existing;
  $("menu-legend").textContent = existing ? "New categories" : "Menu";
}
$("mode-new").addEventListener("change", updateMode);
$("mode-existing").addEventListener("change", updateMode);


/* ---------- Category and dish fields ---------- */
function addDish(block) {
  const row = document.createElement("div");
  row.className = "dish";
  row.innerHTML = `
    <input type="text" class="dish-name" placeholder="Dish name" aria-label="Dish name">
    <input type="number" class="dish-price" placeholder="Price" min="0" step="any" inputmode="decimal" aria-label="Price in pesos">
    <input type="text" class="dish-note" placeholder="Note (optional)" aria-label="Note">
    <button type="button" class="link danger remove-dish" aria-label="Remove dish">✕</button>`;
  block.querySelector(".dishes").appendChild(row);
}

function addCategory() {
  const block = document.createElement("div");
  block.className = "category";
  block.innerHTML = `
    <div class="cat-head">
      <input type="text" class="cat-name" placeholder="Category, e.g. Coffee" aria-label="Category name">
      <button type="button" class="link danger remove-cat">Remove</button>
    </div>
    <div class="dishes"></div>
    <button type="button" class="secondary add-dish">Add dish</button>`;
  $("categories").appendChild(block);
  addDish(block);
}

$("add-category").addEventListener("click", addCategory);
$("categories").addEventListener("click", (e) => {
  const block = e.target.closest(".category");
  if (!block) return;
  if (e.target.closest(".add-dish")) addDish(block);
  if (e.target.closest(".remove-dish")) e.target.closest(".dish").remove();
  if (e.target.closest(".remove-cat")) block.remove();
});

// Reads the form into [{ name, items: [{ name, price, note }] }], skipping incomplete rows.
function readMenu() {
  const menu = [];
  document.querySelectorAll(".category").forEach((block) => {
    const name = block.querySelector(".cat-name").value.trim();
    const items = [];
    block.querySelectorAll(".dish").forEach((row) => {
      const n = row.querySelector(".dish-name").value.trim();
      const p = row.querySelector(".dish-price").value.trim();
      const note = row.querySelector(".dish-note").value.trim();
      if (n && p !== "" && Number(p) >= 0) items.push({ name: n, price: Number(p), note: note || null });
    });
    if (name && items.length) menu.push({ name, items });
  });
  return menu;
}


/* ---------- Save ---------- */
$("builder-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  setMsg("save-msg", "");

  const menu = readMenu();
  if (!menu.length) return setMsg("save-msg", "Add at least one category with one dish (name and price).", true);

  const existing = $("mode-existing").checked;
  let placeRow = null;

  if (existing) {
    if (!$("existing-place").value) return setMsg("save-msg", "There are no places to add to yet.", true);
  } else {
    const f = {
      name: $("name").value.trim(), area: $("area").value.trim(),
      hours: $("hours").value.trim(), description: $("description").value.trim()
    };
    if (!f.name || !f.area || !f.hours || !f.description) {
      return setMsg("save-msg", "Fill in the name, area, hours and description first.", true);
    }
    let slug = slugify(f.name);
    if (!slug) return setMsg("save-msg", "The place name needs some letters or numbers.", true);
    const taken = places.map((p) => p.slug);
    const base = slug;
    for (let n = 2; taken.includes(slug); n++) slug = base + "-" + n;

    placeRow = {
      slug, name: f.name, type: $("type").value, city: $("city").value, area: f.area,
      hours: f.hours, description: f.description,
      updated: $("updated").value.trim() || "Not yet checked", is_sample: false
    };
  }

  const btn = $("save");
  btn.disabled = true; btn.textContent = "Saving…";
  let newPlaceId = null;
  const newCategoryIds = [];

  try {
    let placeId, startOrder = 0;

    if (existing) {
      placeId = $("existing-place").value;
      const { data, error } = await db.from("menu_categories").select("sort_order")
        .eq("place_id", placeId).order("sort_order", { ascending: false }).limit(1);
      if (error) throw error;
      startOrder = data.length ? data[0].sort_order : 0;
    } else {
      const { data, error } = await db.from("places").insert(placeRow).select("id").single();
      if (error) throw error;
      placeId = newPlaceId = data.id;
    }

    for (let i = 0; i < menu.length; i++) {
      const cat = menu[i];
      const { data, error } = await db.from("menu_categories")
        .insert({ place_id: placeId, name: cat.name, sort_order: startOrder + i + 1 })
        .select("id").single();
      if (error) throw error;
      newCategoryIds.push(data.id);

      const rows = cat.items.map((it, j) => ({
        category_id: data.id, name: it.name, price: it.price, note: it.note, sort_order: j + 1
      }));
      const { error: itemsError } = await db.from("menu_items").insert(rows);
      if (itemsError) throw itemsError;
    }

    const label = existing ? $("existing-place").selectedOptions[0].textContent : placeRow.name;
    setMsg("save-msg", "Saved to “" + label + "”. Refresh the live site to see it.");

    // Reset the form, ready for the next one
    ["name", "area", "hours", "description", "updated"].forEach((id) => { $(id).value = ""; });
    $("categories").replaceChildren();
    addCategory();
    await loadPlaces();

  } catch (err) {
    // Undo whatever got created so a half-saved place never shows up on the site.
    // (Deleting a place also deletes its categories and dishes.)
    if (newPlaceId) await db.from("places").delete().eq("id", newPlaceId);
    else if (newCategoryIds.length) await db.from("menu_categories").delete().in("id", newCategoryIds);
    setMsg("save-msg", "Nothing was saved. " + (err.message || "Unknown error") +
      " (Open DevTools > Console for details.)", true);
    console.error(err);
  } finally {
    btn.disabled = false; btn.textContent = "Save to site";
  }
});


/* ---------- Start ---------- */
addCategory();
updateMode();
refreshSession();
</script>
</body>
</html>
